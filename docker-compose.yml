# Local development only. POSTGRES_PASSWORD below is a fixed, public
# default — safe only because this binds to localhost:5432 on a dev
# machine. Never reuse these credentials, or this file unchanged, for
# anything reachable over a network; production uses a managed Postgres
# connection string (Neon/Supabase) via DATABASE_URL instead.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webdesignos
      POSTGRES_PASSWORD: webdesignos
      POSTGRES_DB: webdesignos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
